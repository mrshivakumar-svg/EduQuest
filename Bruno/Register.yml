info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:5000/api/auth/register
  body:
    type: json
    data: |-
      {
        "name": "ABC Doe",
        "email": "abc@example.com",
        "password": "password123",
        "role": "student"
      }
  auth:
    type: bearer
    token: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: register
    description: abc
    request:
      url: http://localhost:5000/api/auth/register
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "ABC",
            "email": "abcdoe@example.com",
            "password": "password123",
            "role": "student"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: register 2
    request:
      url: http://localhost:5000/api/auth/register
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "ABCDEF",
            "email": "abcdef@example.com",
            "password": "password1234",
            "role": "student"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: user already exists
    request:
      url: http://localhost:5000/api/auth/register
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "ABC Doe",
            "email": "abc@example.com",
            "password": "password123",
            "role": "student"
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "message": "User already exists"
          }
  - name: admin cannot self-register
    request:
      url: http://localhost:5000/api/auth/register
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Admin",
            "email": "admin@example.com",
            "password": "password123",
            "role": "admin"
          }
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "message": "Admin cannot self-register"
          }
