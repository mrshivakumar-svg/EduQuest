info:
  name: Author My Courses
  type: http
  seq: 13

http:
  method: GET
  url: http://localhost:5000/api/author/courses
  body:
    type: none
  auth:
    type: bearer
    token: "{{authorToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: my courses
    request:
      url: http://localhost:5000/api/author/courses
      method: GET
      body:
        type: none
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "courses": [
              {
                "id": 1,
                "title": "Intro to Angular",
                "status": "pending",
                "contents": []
              }
            ]
          }
