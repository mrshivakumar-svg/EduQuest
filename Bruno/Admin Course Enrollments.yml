info:
  name: Admin Course Enrollments
  type: http
  seq: 19

http:
  method: GET
  url: http://localhost:5000/api/admin/courses/1/enrollments
  body:
    type: none
  auth:
    type: bearer
    token: "{{adminToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: course enrollments
    request:
      url: http://localhost:5000/api/admin/courses/1/enrollments
      method: GET
      body:
        type: none
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "courseId": 1,
            "enrollments": [
              {
                "id": 1,
                "student": {
                  "id": 18,
                  "name": "ABC Doe",
                  "email": "abc@example.com"
                }
              }
            ]
          }
