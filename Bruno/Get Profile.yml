info:
  name: Get Profile
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:5000/api/auth/profile
  body:
    type: none
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: get profile
    request:
      url: http://localhost:5000/api/auth/profile
      method: GET
      body:
        type: none
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "id": 18,
            "name": "ABC Doe",
            "email": "abc@example.com",
            "role": "student"
          }
  - name: no token
    request:
      url: http://localhost:5000/api/auth/profile
      method: GET
      body:
        type: none
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "message": "Not authorized, no token"
          }
