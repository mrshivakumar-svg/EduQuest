info:
  name: Admin Get Courses
  type: http
  seq: 17

http:
  method: GET
  url: http://localhost:5000/api/admin/courses
  body:
    type: none
  auth:
    type: bearer
    token: "{{adminToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: get courses
    request:
      url: http://localhost:5000/api/admin/courses
      method: GET
      body:
        type: none
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "title": "Intro to Angular",
              "status": "pending",
              "author": {
                "id": 5,
                "name": "Jane Author"
              }
            }
          ]
  - name: forbidden not an admin
    request:
      url: http://localhost:5000/api/admin/courses
      method: GET
      body:
        type: none
    response:
      status: 403
      statusText: Forbidden
      body:
        type: json
        data: |-
          {
            "message": "Forbidden: You do not have permission for this action"
          }
