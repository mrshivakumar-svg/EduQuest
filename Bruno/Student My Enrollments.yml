info:
  name: Student My Enrollments
  type: http
  seq: 7

http:
  method: GET
  url: http://localhost:5000/api/student/my-enrollments
  body:
    type: none
  auth:
    type: bearer
    token: "{{studentToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: my enrollments
    request:
      url: http://localhost:5000/api/student/my-enrollments
      method: GET
      body:
        type: none
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "enrollments": [
              {
                "id": 1,
                "courseId": 1,
                "course": {
                  "id": 1,
                  "title": "Intro to Angular"
                }
              }
            ]
          }
