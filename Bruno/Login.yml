info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:5000/api/auth/login
  body:
    type: json
    data: |-
      {
        "email": "abc@example.com",
        "password": "password123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.token) {
          bru.setEnvVar("token", res.body.token);
          const role = res.body.user && res.body.user.role;
          if (role === "student") bru.setEnvVar("studentToken", res.body.token);
          if (role === "author") bru.setEnvVar("authorToken", res.body.token);
          if (role === "admin") bru.setEnvVar("adminToken", res.body.token);
          console.log("Saved token for role:", role);
        }

examples:
  - name: login
    request:
      url: http://localhost:5000/api/auth/login
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "abc@example.com",
            "password": "password123"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: success
  - name: user not found
    request:
      url: http://localhost:5000/api/auth/login
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "missing@example.com",
            "password": "password123"
          }
    response:
      status: 404
      statusText: Not Found
      body:
        type: json
        data: |-
          {
            "message": "User not found"
          }
  - name: invalid credentials
    request:
      url: http://localhost:5000/api/auth/login
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "abc@example.com",
            "password": "wrongpassword"
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: |-
          {
            "message": "Invalid credentials"
          }
