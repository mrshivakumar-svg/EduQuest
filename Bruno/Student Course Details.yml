info:
  name: Student Course Details
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:5000/api/student/courses/1
  body:
    type: none
  auth:
    type: bearer
    token: "{{studentToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: course details
    request:
      url: http://localhost:5000/api/student/courses/1
      method: GET
      body:
        type: none
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "id": 1,
            "title": "Intro to Angular",
            "description": "Learn Angular basics",
            "price": 49.99,
            "status": "approved",
            "contents": []
          }
